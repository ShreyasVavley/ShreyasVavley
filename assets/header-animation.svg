<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="50%" stop-color="#0f0f15"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <!-- Crimson Glow Gradient -->
    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanline Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { transform: translateX(-400px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(850px); opacity: 0; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes textGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.85)); }
    }

    .laser-line {
      animation: laserSweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .pulse-glow {
      animation: pulseGlow 3s ease-in-out infinite;
    }

    .live-dot {
      animation: blink 1.8s ease-in-out infinite;
    }

    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }

    .banner-title {
      animation: textGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Container -->
  <rect width="846" height="196" x="2" y="2" rx="16" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5"/>

  <!-- Subtle Cyber Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="40" x2="850" y2="40" />
    <line x1="0" y1="80" x2="850" y2="80" />
    <line x1="0" y1="120" x2="850" y2="120" />
    <line x1="0" y1="160" x2="850" y2="160" />
    <line x1="170" y1="0" x2="170" y2="200" />
    <line x1="340" y1="0" x2="340" y2="200" />
    <line x1="510" y1="0" x2="510" y2="200" />
    <line x1="680" y1="0" x2="680" y2="200" />
  </g>

  <!-- Glowing Ambient Corner Glows -->
  <circle cx="100" cy="50" r="80" fill="#ef4444" opacity="0.08" class="pulse-glow" filter="url(#glow)"/>
  <circle cx="750" cy="150" r="100" fill="#ef4444" opacity="0.06" class="pulse-glow" filter="url(#glow)"/>

  <!-- Border Highlight Accents -->
  <path d="M 2 24 L 2 16 Q 2 2 16 2 L 40 2" stroke="#ef4444" stroke-width="2.5" fill="none" filter="url(#softGlow)"/>
  <path d="M 810 2 L 834 2 Q 848 2 848 16 L 848 40" stroke="#ef4444" stroke-width="2.5" fill="none" filter="url(#softGlow)"/>
  <path d="M 2 176 L 2 184 Q 2 198 16 198 L 40 198" stroke="#ef4444" stroke-width="2.5" fill="none" filter="url(#softGlow)"/>
  <path d="M 810 198 L 834 198 Q 848 198 848 184 L 848 160" stroke="#ef4444" stroke-width="2.5" fill="none" filter="url(#softGlow)"/>

  <!-- Scanning Laser Beam -->
  <rect x="0" y="2" width="300" height="2" fill="url(#laserGrad)" class="laser-line" />

  <!-- Floating Ambient Particles -->
  <circle cx="120" cy="70" r="1.5" fill="#ef4444" opacity="0.6" class="particle" />
  <circle cx="720" cy="60" r="2" fill="#ef4444" opacity="0.5" class="particle" style="animation-delay: 1.5s;" />
  <circle cx="680" cy="130" r="1.5" fill="#ffffff" opacity="0.4" class="particle" style="animation-delay: 0.8s;" />
  <circle cx="180" cy="140" r="2" fill="#ef4444" opacity="0.4" class="particle" style="animation-delay: 2.2s;" />

  <!-- Top Badges / Status Bar -->
  <g transform="translate(36, 32)">
    <!-- Active Status Pill -->
    <rect x="0" y="0" width="138" height="22" rx="11" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="12" cy="11" r="3.5" fill="#10b981" class="live-dot"/>
    <text x="24" y="15" fill="#e4e4e7" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="bold" letter-spacing="1">SYSTEM ACTIVE</text>

    <!-- Leadership Pill -->
    <rect x="150" y="0" width="205" height="22" rx="11" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <text x="162" y="15" fill="#f59e0b" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="bold" letter-spacing="1">⚡ AWS CAMPUS LEADER '26</text>
  </g>

  <!-- Main Headline Banner -->
  <g transform="translate(36, 102)">
    <!-- Terminal Prompt Symbol -->
    <text x="0" y="0" fill="#ef4444" font-family="'Courier New', Consolas, monospace" font-size="34" font-weight="900" filter="url(#softGlow)">&gt;</text>
    <text x="30" y="0" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" class="banner-title">SHREYAS VAVLEY</text>
    <circle cx="370" cy="-8" r="4.5" fill="#ef4444" filter="url(#glow)"/>
  </g>

  <!-- Subtitle / Role Track -->
  <g transform="translate(36, 138)">
    <text x="0" y="0" fill="#a1a1aa" font-family="'Courier New', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2">
      AI &amp; FULL-STACK ARCHITECT <tspan fill="#ef4444">//</tspan> AGENTIC SYSTEMS &amp; CIVIC-TECH
    </text>
  </g>

  <!-- Bottom Coordinates & Metric Tag -->
  <g transform="translate(36, 172)">
    <text x="0" y="0" fill="#71717a" font-family="'Courier New', Consolas, monospace" font-size="10" letter-spacing="1.5">
      LOC: 12.9716°N, 77.5946°E [BLR, IN]  |  SAPTHAGIRI NPS UNIVERSITY  |  CLASS OF 2028
    </text>
  </g>

  <!-- Subtle Right-side Tech Code Block Graphic -->
  <g transform="translate(685, 82)">
    <rect x="0" y="0" width="128" height="66" rx="8" fill="#000000" fill-opacity="0.5" stroke="#27272a" stroke-width="1"/>
    <circle cx="12" cy="12" r="3" fill="#ef4444" opacity="0.8"/>
    <circle cx="22" cy="12" r="3" fill="#f59e0b" opacity="0.8"/>
    <circle cx="32" cy="12" r="3" fill="#10b981" opacity="0.8"/>
    <text x="12" y="32" fill="#71717a" font-family="'Courier New', monospace" font-size="9">const dev = {</text>
    <text x="20" y="44" fill="#ef4444" font-family="'Courier New', monospace" font-size="9">  mode: 'Agentic',</text>
    <text x="20" y="56" fill="#10b981" font-family="'Courier New', monospace" font-size="9">  build: 'Scale'</text>
  </g>
</svg>
